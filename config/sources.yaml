  data_gov_hr_id: "upravne-jedinice-inspire"
  landing_url: "https://geoportal.dgu.hr/services/atom/au/xml"
  access:
    type: atom
    service_feed: "https://geoportal.dgu.hr/services/atom/xml"
    dataset_feed: "https://geoportal.dgu.hr/services/atom/au/xml"
    file: "https://geoportal.dgu.hr/services/atom/INSPIRE_Administrative_Units_(AU).zip"
    wms: "https://geoportal.dgu.hr/services/inspire/au/wms"
  format: inspire_gml_3.2.1_zip
  license: "Otvorena dozvola (zapis na Portalu)"
  attribution: "Izvor: Geoportal Državne geodetske uprave"
  schedule: null
  robots_allowed: true
  used_for: [boundaries, jls_codes, settlement_codes, cell_assignment]
  priority: P0
  verification:
    status: verified
    date: 2026-11-01
    note: >-
      ATOM nudi INSPIRE GML 3.2.1 u ETRS89/LAEA (EPSG:3035), a ne SHP u EPSG:3765 kako navodi SPEC.
      Zip ima oko 209 MB. ATOM servis u polju rights navodi „ograničenje javnog pristupa prema
      članku 13 stavku 1 točki (e) INSPIRE Direktive”, a Portal Otvorenu dozvolu: mjerodavnim
      smatramo zapis na Portalu. Provjera datoteke 1. 11.: AdministrativeUnit.gml ima 21 županijsku
      jedinicu (nationalCode 2 znaka), 556 JLS-ova (5 znakova), 6.759 naselja (6 znakova), 13.594
      statistička i 29.263 popisna kruga. Razinu daje nationalLevel, a nadređenu jedinicu
      upperLevelUnit. Podatak o tome je li JLS grad ili općina nije u GML-u.
  fallback: "GISCO LAU 2021 za JLS; DZS/RGI točke s Voronoijem za naselja (ADR)"
  verify:
    probes:
      - url: "https://geoportal.dgu.hr/services/atom/xml"
        count: { kind: xml_tag, tag: entry }
      - url: "https://geoportal.dgu.hr/services/atom/au/xml"
        count: { kind: xml_tag, tag: entry }
        fixture: atom_au.xml
      - url: "https://geoportal.dgu.hr/services/atom/INSPIRE_Administrative_Units_(AU).zip"
        method: ZIP
        count: { kind: zip_entries }
      - url: "https://geoportal.dgu.hr/services/inspire/au/wms?service=WMS&request=GetCapabilities"
        count: { kind: xml_tag, tag: Layer }

