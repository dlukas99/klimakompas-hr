- id: open_meteo
  name: "Open-Meteo: prognoza, povijesni ERA5 i CAMS kvaliteta zraka"
  publisher: "Open-Meteo"
  landing_url: "https://open-meteo.com"
  docs_url: "https://open-meteo.com/en/terms"
  access:
    type: rest
    forecast: "https://api.open-meteo.com/v1/forecast"
    archive: "https://archive-api.open-meteo.com/v1/archive"
    air_quality: "https://air-quality-api.open-meteo.com/v1/air-quality"
    usage: non_commercial
    limits:   # free API, https://open-meteo.com/en/terms, checked 2026-11-01
      calls_per_minute: 600
      calls_per_hour: 5000
      calls_per_day: 10000
      calls_per_month: 300000
    max_locations_per_request: 1000
    weight_formula: "locations * (days / 14) * (variables / 10)"
  format: json
  license: "CC BY 4.0, uz navođenje; besplatno za nekomercijalnu uporabu"
  attribution: "Weather data by Open-Meteo.com (CC BY 4.0)"
  schedule: null
  robots_allowed: false
  used_for: [nowcast_features, cams_fallback, ecde_fallback]
  priority: P1
  verification:
    status: verified
    date: 2026-11-01
    note: >-
      robots.txt na API hostovima ima „Disallow: /”, a stranica open-meteo.com „Allow: /”. Odluka
      korisnika (ADR 0002): API je javno namijenjen programskom pristupu, pa ga koristimo za
      nekomercijalnu namjenu, unutar limita i uz atribuciju. Provjera šalje po jedan najmanji poziv
      na svaki host.
  verify:
    policy: api_terms
    probes:
      - url: "https://api.open-meteo.com/v1/forecast?latitude=45.55&longitude=18.69&hourly=temperature_2m&forecast_days=1"
        fixture: forecast.json
      - url: "https://archive-api.open-meteo.com/v1/archive?latitude=45.55&longitude=18.69&hourly=temperature_2m&start_date=2025-07-01&end_date=2025-07-01"
        fixture: archive.json
      - url: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=45.55&longitude=18.69&hourly=pm2_5&forecast_days=1"
        fixture: air_quality.json

