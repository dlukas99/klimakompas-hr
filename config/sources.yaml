- id: azo_aq_rest
  name: "Kvaliteta zraka u RH – RESTful servis"
  publisher: "Ministarstvo zaštite okoliša i zelene tranzicije"
  landing_url: "https://iszz.azo.hr/iskzl/exc.htm"
  docs_url: "https://iszz.azo.hr/iskzl/doc/servis_uputa.pdf"
  access:
    type: rest
    url_template: "https://iszz.azo.hr/iskzl/rs/podatak/export/json?postaja={station}&polutant={pollutant}&tipPodatka={dtype}&vrijemeOd={date_from}&vrijemeDo={date_to}"
    date_format: "%d.%m.%Y"
    dtype_hourly: 0
    dtype_daily: 4
  format: json
  license: "TODO(verify)"
  attribution: "Izvor: Ministarstvo zaštite okoliša i zelene tranzicije – Kvaliteta zraka u RH (iszz.azo.hr)"
  schedule: "20 * * * *"
  stale_after: "PT6H"
  robots_allowed: true
  used_for: [air_live, nowcast]
  priority: P0
  verification:
    status: verified
    date: 2026-11-01
    note: >-
      tipPodatka=0 vraća satne vrijednosti (do 48 zapisa za 2 dana), a tipPodatka=4 dnevne
      (2 zapisa za 2 dana). Vrijednosti 1, 2, 3 i 5 na testiranoj postaji vraćaju prazan popis.
      Stvarni oblik zapisa je ravan: {vrijednost, mjernaJedinica, vrijeme}, a vrijeme je Unix epoha
      u milisekundama, a ne ugniježđeni objekt s ISO vremenom iz SPEC-a. Servis ograničava
      učestalost: uz razmak od 0,5 s svaki drugi zahtjev dobiva HTTP 429 bez Retry-After, a uz razmak
      od 4 s svih 15 zahtjeva je prošlo. Worker zato mora razmaknuti pozive; točnu donju granicu još
      treba utvrditi. PM2,5 za 29.–31. 10. 2026. vratile su postaje 155, 156, 157, 159, 161, 162,
      165, 255 i 275, a prazno su vratile 160 (Osijek-1), 168, 277, 278, 286 i 300 (Osijek – PPI),
      pa Osijek u tom razdoblju nema trenutni PM2,5. Provjera 1. 11.: postaja 160 ima satni PM10
      (polutant 5), a postaja 300 nema ni PM10 ni PM2,5; pravilo prikaza je u ADR 0004. Validiranost
      podataka još nije utvrđena: TODO(verify).
  fallback: open_meteo
  verify:
    portal_query: "kvaliteta zraka republika hrvatska"
    probes:
      - url: "https://iszz.azo.hr/iskzl/rs/podatak/export/json?postaja=155&polutant=5&tipPodatka=0&vrijemeOd={date_from}&vrijemeDo={date_to}"
        count: { kind: json_list }
        fixture: zagreb1_pm10_hourly.json
      - url: "https://iszz.azo.hr/iskzl/rs/podatak/export/json?postaja=155&polutant=5&tipPodatka=4&vrijemeOd={date_from}&vrijemeDo={date_to}"
        count: { kind: json_list }
        fixture: zagreb1_pm10_daily.json
      - url: "https://iszz.azo.hr/iskzl/rs/podatak/export/json?postaja=300&polutant=28&tipPodatka=0&vrijemeOd={date_from}&vrijemeDo={date_to}"
        count: { kind: json_list }
        expect_empty_ok: true
      - url: "https://iszz.azo.hr/iskzl/koordinate.htm"
      - url: "https://iszz.azo.hr/iskzl/status.htm"

