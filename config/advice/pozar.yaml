items:
  - "Dim ili požar odmah prijavite na 112 ili 193."
  - "Ne palite vatru na otvorenom i ne bacajte opuške."
  - "Ako ne možete sigurno otići, zatvorite vrata i prozore, a nos i usta pokrijte vlažnom tkaninom."
  - "Odmah poslušajte nalog za evakuaciju."
