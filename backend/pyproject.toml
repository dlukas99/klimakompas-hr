[project]
name = "klimakompas"
version = "0.1.0"
description = "KlimaKompas HR: climate risk index for Croatia from open data"
requires-python = ">=3.12,<3.13"
license = "EUPL-1.2"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler<4",
    "cdsapi>=0.7.7",
    "fastapi>=0.162.0",
    "httpx",
    "lxml",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic",
    "pydantic-settings",
    "pyproj>=3.8.0",
    "pyyaml",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.6",
    "structlog",
    "tenacity",
    "typer",
    "uvicorn>=0.54.0",
    "xarray>=2026.9.0",
]

[project.scripts]
kk = "klimakompas.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pip-licenses",
    "pre-commit",
    "pytest",
    "ruff",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml",
    "types-shapely>=2.1.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klimakompas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["klimakompas"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lxml.*", "rasterio.*", "cdsapi.*", "scipy.*", "affine.*", "netCDF4.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
