[project]
name = "klimakompas"
version = "0.1.0"
description = "KlimaKompas HR: climate risk index for Croatia from open data"
requires-python = ">=3.12,<3.13"
license = "EUPL-1.2"
dependencies = [
    "httpx",
    "lxml",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "structlog",
    "tenacity",
    "typer",
]

[project.scripts]
kk = "klimakompas.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pip-licenses",
    "pre-commit",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klimakompas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["klimakompas"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
