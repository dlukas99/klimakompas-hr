services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-test:
    image: postgis/postgis:16-3.4
    profiles: [test]
    environment:
      POSTGRES_USER: kk_test
      POSTGRES_PASSWORD: kk_test  # pragma: allowlist secret
      POSTGRES_DB: klimakompas_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk_test -d klimakompas_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  martin:
    image: ghcr.io/maplibre/martin:1.16.0
    command: ["--config", "/config/martin.yaml"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./infra/martin.yaml:/config/martin.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.40.13
    profiles: [llm]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    gpus: all

volumes:
  db-data:
  ollama-data:
