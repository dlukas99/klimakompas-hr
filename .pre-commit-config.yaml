exclude: ^(backend/tests/fixtures/|LICENSE$)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--config=backend/pyproject.toml]
        files: ^(backend|infra)/.*\.py$
      - id: ruff-format
        args: [--config=backend/pyproject.toml]
        files: ^(backend|infra)/.*\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (package-lock\.json|uv\.lock|\.env\.example|docs/SPEC\.md)$
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npx prettier --write --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/
